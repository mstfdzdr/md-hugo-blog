{{ define "main" }}
  <div class="py-20 text-center">
    <p class="font-mono text-6xl text-strong" data-error-emoji>(&gt;_&lt;)</p>
    <h1 class="mt-6 text-2xl font-bold text-strong">{{ T "pageNotFound" }}</h1>
    <p class="mt-2 text-muted">{{ T "pageNotFoundText" }}</p>
    <a href="{{ site.Home.RelPermalink }}" class="mt-6 inline-flex items-center gap-1.5 text-accent hover:underline">
      {{- partial "icon.html" (dict "name" "house" "class" "size-4") }}{{ T "home" }}
    </a>
  </div>
{{ end }}
