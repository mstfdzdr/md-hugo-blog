{{- partial "post/featured-image.html" (dict "page" . "preview" true) }}
{{- partial "post/summary-header.html" . }}
<p class="mt-3 line-clamp-3 leading-relaxed text-fg/85">
  {{- with .Summary }}{{ . | plainify | htmlUnescape }}{{ else }}{{ .Description }}{{ end -}}
</p>
<footer class="mt-4 flex flex-wrap items-center justify-between gap-2 text-sm">
  <a href="{{ .RelPermalink }}" class="font-medium text-accent hover:underline">{{ T "readMore" }}</a>
  {{- partial "post/tags.html" . }}
</footer>
