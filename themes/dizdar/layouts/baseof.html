<!doctype html>
<html lang="{{ site.Language.Locale }}">
  <head>
    {{- partial "head.html" . }}
  </head>
  <body class="flex min-h-screen flex-col" data-i18n="{{ partial "i18n-js.html" . }}">
    {{- partial "header.html" . }}
    <main class="mx-auto w-full max-w-3xl flex-1 px-4 pt-24 pb-16 sm:px-6">
      {{- block "main" . }}{{ end }}
    </main>
    {{- partial "footer.html" . }}
    {{- partial "search.html" . }}
    {{- with resources.Get "js/main.js" | js.Build (dict "minify" (not hugo.IsDevelopment)) | fingerprint }}
      <script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" crossorigin="anonymous" defer></script>
    {{- end }}
  </body>
</html>
